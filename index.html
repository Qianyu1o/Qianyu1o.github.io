<style>
/* Layout: one screen, no page scroll. A sidebar index on the left, a dark stage of the work on the right that the
   visitor leafs through (wheel, drag, click, arrow keys); images change at once, with no motion. Opening a project
   adds its introduction beside the stage. Single dark look, by choice: the work lives in the dark. */
:root {
  --night: #0a0d0c;        /* page */
  --plate: #040605;        /* stage behind the images */
  --ink: #e7e3d9;          /* text, warm like paper under a lamp */
  --muted: #8b938e;
  --rule: #232a27;
  --lamp: #e9d5aa;         /* accent: the projector light */
  --tbc: #3a3417;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --small: 0.75rem;
  --body: 1rem;
  --side: 15.5rem;
  --panel: 23rem;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overflow: clip; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font: 400 var(--body)/1.6 var(--serif); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--lamp); outline-offset: 4px; }
p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
.label { font: 500 var(--small)/1.4 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tbc { background: var(--tbc); padding: 0 0.25em; border-radius: 2px; }

.shell { height: 100%; display: grid; grid-template-columns: var(--side) minmax(0, 1fr); gap: 24px; }
.shell.open { grid-template-columns: var(--side) minmax(0, 1fr) var(--panel); }

/* sidebar */
.side { display: flex; flex-direction: column; gap: 28px; min-height: 0; padding-block: 8px 4px; }
.me { display: grid; gap: 6px; }
.me a { font: 400 1.9rem/1 var(--display); }
.index { display: grid; gap: 4px; }
.index ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.index a { display: grid; grid-template-columns: 0.9rem minmax(0, 1fr); align-items: baseline; padding: 6px 0; }
.index a::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--lamp); opacity: 0; transform: translateY(-0.2em); transition: opacity 0.3s ease; }
.index a b { font: 400 1.45rem/1.1 var(--display); color: var(--muted); transition: color 0.25s ease; }
.index a small { grid-column: 2; font: 400 0.7rem/1.5 var(--mono); letter-spacing: 0.06em; color: var(--muted); }
.index a:hover b, .index a.on b { color: var(--ink); }
.index a.on::before { opacity: 1; }
.links { margin-top: auto; display: grid; gap: 10px; }
.links nav { display: flex; gap: 20px; }
.links nav a { font: 500 var(--small)/1.4 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.links nav a:hover, .links nav a.on { color: var(--ink); }
.draft { font: 400 0.68rem/1.5 var(--mono); color: var(--muted); max-width: 26ch; }

/* stage */
.stage { position: relative; min-width: 0; min-height: 0; background: var(--plate); overflow: hidden; overflow: clip; touch-action: pan-y; user-select: none; }
.layer { position: absolute; inset: 0; display: grid; place-items: center; }
.layer img { width: 100%; height: 100%; object-fit: contain; max-width: 100%; pointer-events: none; }
.shell:not(.open) .layer img { object-fit: cover; }
@media (max-width: 860px) { .shell:not(.open) .layer img { object-fit: contain; } }
.empty { display: grid; gap: 10px; place-items: center; text-align: center; padding: 24px; }
.empty h2 { font-size: clamp(2.4rem, 6vw, 5rem); color: var(--ink); }

.cap { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px;
  padding: 18px 20px; pointer-events: none; text-shadow: 0 1px 14px rgba(4, 6, 5, 0.7), 0 0 2px rgba(4, 6, 5, 0.5); }
.cap::before { content: ""; position: absolute; inset: -40% 0 0; z-index: -1; pointer-events: none;
  background: linear-gradient(to top, rgba(4, 6, 5, 0.32), rgba(4, 6, 5, 0.12) 45%, rgba(4, 6, 5, 0)); }
.cap > * { pointer-events: auto; }
.title { display: grid; gap: 8px; min-width: 0; }
.title h1 { font-size: clamp(2.6rem, 7vw, 6.2rem); line-height: 0.92; }

.shell.open .title h1 { font-size: clamp(1.8rem, 3.4vw, 2.8rem); }
.count { display: grid; justify-items: end; gap: 6px; text-align: right; }
.count .n { font: 400 0.8rem/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }
.count .n b { font-weight: 500; color: var(--lamp); }
.count .what { font: 400 0.72rem/1.4 var(--mono); color: var(--muted); max-width: 34ch; }
.arrows { display: flex; gap: 6px; }
.arrows button { width: 34px; height: 34px; border: 1px solid var(--rule); border-radius: 50%; display: grid; place-items: center; font: 400 0.9rem/1 var(--mono); color: var(--ink); background: transparent; border-color: rgba(231, 227, 217, 0.28); }
.arrows button:hover { color: var(--ink); border-color: var(--muted); }
.hint { position: absolute; z-index: 3; top: 16px; right: 18px; font: 400 0.68rem/1.4 var(--mono); color: var(--muted); letter-spacing: 0.06em; pointer-events: none; transition: opacity 0.6s ease; }
.cursor { position: fixed; left: 0; top: 0; pointer-events: none; font: 500 0.68rem/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--lamp); opacity: 0; transition: opacity 0.2s ease; transform: translate(-50%, -50%); white-space: nowrap; z-index: 20; }
.stage.pointer { cursor: none; }
.cursor.on { opacity: 1; }

/* introduction panel */
.panel { min-width: 0; min-height: 0; display: none; flex-direction: column; gap: 16px; }
.shell.open .panel { display: flex; }
.panel .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 8px; }
.panel .close { font: 500 var(--small)/1.4 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.panel .close:hover { color: var(--ink); }
.read { overflow-y: auto; min-height: 0; padding-right: 6px; display: grid; gap: 14px; align-content: start; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.read h2 { font-size: 2.2rem; }
.read p { font-size: 0.97rem; max-width: 60ch; }
.read p.lede { font-size: 1.12rem; line-height: 1.5; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--rule); }
.facts dt { font: 500 0.68rem/1.7 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-size: 0.9rem; min-width: 0; }
.cv { display: grid; gap: 4px; border-top: 1px solid var(--rule); padding-top: 12px; }
.cv div { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 12px; font-size: 0.88rem; padding: 4px 0; }
.cv span:first-child { white-space: nowrap; font: 400 0.75rem/1.8 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.big { font: 400 1.9rem/1.2 var(--display); }

@media (max-width: 1100px) {
  :root { --side: 12.5rem; --panel: 20rem; }
}
@media (max-width: 860px) {
  .shell, .shell.open { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
  .side { gap: 10px; padding: 0; }
  .me { grid-auto-flow: column; justify-content: space-between; align-items: baseline; }
  .index > .label, .draft { display: none; }
  .index ol { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; }
  .index a { display: block; padding: 2px 0; }
  .index a::before { display: none; }
  .index a b { font-size: 1.15rem; }
  .index a small { display: none; }
  .index a.on b { color: var(--lamp); }
  .links { margin: 0; }
  /* phone: the image keeps the top of the screen and the introduction scrolls underneath it */
  .shell.open { grid-template-rows: auto minmax(0, 42%) minmax(0, 1fr); }
  .panel { border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); gap: 10px; }
  .panel .head { padding-top: 10px; }
  .shell.open .cap .label, .shell.open .cap .what, .shell.open .title .more { display: none; }
  .shell.open .title h1 { font-size: 1.6rem; }
  .shell.open .layer img { object-fit: contain; }
  .cap { padding: 12px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
}

<template id="t-fifth-season">
  <h2>The Fifth Season</h2>
  <p class="lede">In the Five Elements there is a fifth season, the long summer. It belongs to earth and to the centre, between the other four. The work stays there: one summer night, from dusk to first light, that ends and begins again.</p>
  <p>A faceless figure in a crystal body dances in a single beam of light. The life in the grass around her is generated by a machine: it does not exist in reality, and appears only in that light.</p>
  <p>The one she reaches for never appears. She is heard instead, in the insects and the grass, and once, for two seconds of silence, in the sound of watered flowers drinking.</p>
  <p><em>Instant Fold</em> decentred the human. <em>The Fifth Season</em> decentres the body. It asks how the dead remain: no longer here, and never simply gone.</p>
  <dl class="facts">
    <dt>Status</dt><dd>In production</dd>
    <dt>Form</dt><dd>A two-minute film that loops, then sculpture, print and resin, and VR</dd>
    <dt>Made with</dt><dd>Blender, motion capture, geometry nodes, generative imagery</dd>
    <dt>Ideas</dt><dd>Becoming, hauntology, continuing bonds, animacy</dd>
  </dl>
</template>

<template id="t-jankspace">
  <h2>Jankspace: Residues of The Stack</h2>
  <p class="lede">A third-person open-world game by Daniel Felstead and Jenn Leung, commissioned by State of Fashion. The player moves through a labyrinth of glossy, crimson showrooms as the digital twin of Julia Fox.</p>
  <p>I built the game's environments in Unreal Engine, developed materials and bound hair to the character rigs, and worked on 3D animation for the in-world film <em>Welcome to Jankspace, Babes</em>, released on DIS in 2025.</p>
  <dl class="facts">
    <dt>Role</dt><dd>3D environment artist, Unreal Engine team</dd>
    <dt>Shown</dt><dd>State of Fashion Biennale 2026, <em>Available to Promise</em>, Arnhem, Netherlands</dd>
    <dt></dt><dd><em>Infrastructures: making space for the desires of others</em>, curated by Václav Janoščík, Dům umění Ústí nad Labem, Czech Republic</dd>
    <dt>Credits</dt><dd>Game design and creative direction: Daniel Felstead. Interaction design and development: Jenn Leung. Digital fashion skins: Marie Lueder and Holly Jayne Wild.</dd>
  </dl>
</template>

<template id="t-animacy">
  <h2>Animacy 2.0</h2>
  <p class="lede">A multidimensional ecosystem of cohabitation at the intersection of the artificial and the digital. The images were grown, not found.</p>
  <p>Night photographs of plants were read back as text by a vision-language model, used to train custom models, and pushed until the plants turned strange: light now comes from inside them, and their forms drift between flower, skull and bird.</p>
  <p>Printed on canvas, then finished by hand with resin that coils over the stems and spills past the frame, so the digital image gains a physical body no model generated.</p>
  <dl class="facts">
    <dt>Medium</dt><dd>Print on canvas, resin</dd>
    <dt>Format</dt><dd>Four panels, 25 × 25 cm each, hung in a single vertical column</dd>
    <dt>Shown</dt><dd><em>The Green Grammar</em>, ArtSECT Gallery, London, May 2025</dd>
    <dt></dt><dd><em>Soft Borders</em>, Bartha Contemporary, London, 12 to 15 November 2026</dd>
  </dl>
</template>

<template id="t-wonderland">
  <h2>Wonderland</h2>
  <p class="lede">A moving-image work built around one character and the worlds she passes through: open sky, green water, a forest floor.</p>
  <p>A hand reaches into the clouds, a snail crosses a palm, a koi slides past her face. Then her face becomes a desktop, with folders and a balance.</p>
  <p>I built the character and the scenes.</p>
  <dl class="facts">
    <dt>Role</dt><dd>Character and scene building</dd>
    <dt>Shown</dt><dd><em>Veins of Dreams</em>, ArtSECT Gallery, London, 4 to 6 September 2024</dd>
    <dt></dt><dd><em>Bodystack</em>, Aesthetica Short Film Festival, York, 8 November 2024</dd>
  </dl>
</template>

<template id="t-instant-fold">
  <h2>Instant Fold</h2>
  <p class="lede">An experimental short film responding to inhumanism, xenofeminism and animism. The world is a container of constant elements; only their arrangement and order change.</p>
  <p>A figure shifts between human, horse and centaur across three scenes, <em>Field</em>, <em>Wave</em> and <em>Echo</em>, in a space without fixed scale, where a blade of grass and a giant eye share the same field.</p>
  <dl class="facts">
    <dt>Made with</dt><dd>Blender, Unreal Engine 5, TouchDesigner, Clo3D, ZBrush, Xsens motion capture, MotionBuilder</dd>
    <dt>Shown</dt><dd>Flair Fashion, London, 2025</dd>
  </dl>
</template>

<template id="t-about">
  <h2>About</h2>
  <p class="lede">I work with animacy: the moment something without a body, or without life, becomes present to us. I call that moment the instant fold.</p>
  <p>I grew up in a Buddhist family. When I watered the flowers as a child, my mother told me that the gurgling sound was the flower drinking. I chose to believe her, and that choice planted something in me that has never left: the belief that everything, living or not, has a life of its own.</p>
  <p>My works stage this moment with digital means: real-time 3D, motion capture, generative media and hand-finished resin. In each work, a single light in the dark makes something present that would otherwise go unseen.</p>
  <div class="cv">
    <span class="label">Exhibitions and screenings</span>

    <div><span>2026</span><span><em>Infrastructures</em>, Dům umění Ústí nad Labem. <em>Jankspace</em></span></div>
    <div><span>2026</span><span>State of Fashion Biennale, Arnhem. <em>Jankspace</em></span></div>
    <div><span>2025</span><span>DIS, online. <em>Welcome to Jankspace, Babes</em></span></div>
    <div><span>2025</span><span>Flair Fashion, London (screening). <em>Instant Fold</em></span></div>
    <div><span>2025</span><span><em>The Green Grammar</em>, ArtSECT Gallery, London. <em>Animacy 2.0</em></span></div>
    <div><span>2024</span><span><em>Bodystack</em>, Aesthetica Short Film Festival, York. <em>Wonderland</em></span></div>
    <div><span>2024</span><span><em>Veins of Dreams</em>, ArtSECT Gallery, London. <em>Wonderland</em></span></div>
    <div><span>2018</span><span><em>Zebra</em>, Beijing International Biennale, with OISTAT. Group work, The Central Academy of Drama</span></div>
  </div>

    if (!w.images.length) {
      next.innerHTML = '<div class="empty"><h2>' + w.title + '</h2><span class="label">Images to come</span></div>';
    } else {
      var im = w.images[idx];
      next.innerHTML = '<img src="' + im[0] + '" width="' + im[1] + '" height="' + im[2] + '" alt="' + im[3].replace(/"/g, "") + '">';
    }
    next.style.zIndex = 2; old.style.zIndex = 1; old.innerHTML = "";
    front = 1 - front;
    var n = w.images.length;
    $("num").innerHTML = n ? "<b>" + pad(idx + 1) + "</b> / " + pad(n) : "";
    $("what").textContent = n ? w.images[idx][3] : "";
    $("prev").hidden = $("next").hidden = n < 2;
    stage.classList.toggle("pointer", n > 1 && matchMedia("(hover: hover)").matches);
  }

  function turn(step) {
    var n = WORKS[cur].images.length;
    if (n < 2 || lock) return;
    lock = true; setTimeout(function () { lock = false; }, 350);
    idx = (idx + step + n) % n;
    paint(true);
    $("hint").style.opacity = 0;
  }

  function setWork(k) {
    if (cur === k) return;
    cur = k; idx = 0;
    $("title").textContent = WORKS[k].title;
    $("kicker").textContent = WORKS[k].kicker;
    $("more").href = "#" + k;
    document.querySelectorAll("[data-work]").forEach(function (a) { a.classList.toggle("on", a.dataset.work === k); });
    paint(true);
  }

  function route() {
    var h = (location.hash || "").slice(1);
    var open = WORKS[h] ? h : (PAGES[h] ? h : null);
    if (WORKS[h]) setWork(h); else if (!cur) setWork("fifth-season");
    shell.classList.toggle("open", !!open);
    $("more").hidden = !!open;
    document.querySelectorAll("[data-page]").forEach(function (a) { a.classList.toggle("on", a.dataset.page === h); });
    if (open) {
      $("panelLabel").textContent = WORKS[h] ? WORKS[h].kicker : PAGES[h];
      $("read").innerHTML = $("t-" + h).innerHTML;
      $("read").scrollTop = 0;
    }
  }
  window.addEventListener("hashchange", route);
  route();

  // leafing through: wheel or trackpad, drag or swipe, click, keys
  var acc = 0, accT = 0;
  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    var now = Date.now(); if (now - accT > 220) acc = 0; accT = now;
    acc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (Math.abs(acc) > 40) { turn(acc > 0 ? 1 : -1); acc = 0; }
  }, { passive: false });

  var down = null, moved = false;
  stage.addEventListener("pointerdown", function (e) { if (e.target.closest("a, button")) return; down = { x: e.clientX, y: e.clientY }; moved = false; });
  stage.addEventListener("pointermove", function (e) {
    var r = stage.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width - 0.5, fy = (e.clientY - r.top) / r.height - 0.5;
    var c = $("cursor");
    c.style.left = e.clientX + "px"; c.style.top = e.clientY + "px";
    c.textContent = fx < 0 ? "← Previous" : "Next →";
    c.classList.toggle("on", stage.classList.contains("pointer") && !e.target.closest("a, button"));
    if (down && Math.abs(e.clientX - down.x) > 8) moved = true;
  });
  stage.addEventListener("pointerleave", function () { $("cursor").classList.remove("on"); });
  stage.addEventListener("pointerup", function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { turn(dx < 0 ? 1 : -1); return; }
    if (!moved) { var r = stage.getBoundingClientRect(); turn(e.clientX - r.left < r.width / 2 ? -1 : 1); }
  });
  $("prev").addEventListener("click", function () { turn(-1); });
  $("next").addEventListener("click", function () { turn(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); turn(1); }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); turn(-1); }
    if (e.key === "Escape" && shell.classList.contains("open")) location.hash = "";
  });
})();
</script>
</body>
</html>
