<template id="t-fifth-season">
  <h2>The Fifth Season</h2>
  <p class="quote">不生不灭，不垢不净，不增不减<br>Neither arising nor ceasing, neither defiled nor pure, neither increasing nor decreasing.<br><span style="font-style:normal;font-size:0.8em">The Heart Sutra</span></p>
  <p class="lede"><em>The Fifth Season</em> is a field.</p>
  <p>Daylight turns to night, and night to daylight, and the field moves with it. The mind turns with its surroundings; the surroundings turn with the mind <span style="white-space:nowrap">(心随境转，境随心转)</span>.</p>
  <p>Nothing arises and nothing ceases. Still, the light keeps changing.</p>
  <p>It is set in the fifth season, the long summer: the season between seasons.</p>
  <dl class="facts">
    <dt>Status</dt><dd>In production</dd>
    <dt>Form</dt><dd>Moving image, a two-minute loop, with a resin work in development</dd>

<template id="t-jankspace">
  <h2>Jankspace: Residues of The Stack</h2>
  <p class="lede">A third-person open-world game by Daniel Felstead and Jenn Leung, commissioned by State of Fashion. The player moves through a labyrinth of glossy, crimson showrooms as the digital twin of Julia Fox.</p>
  <p>I built the game's environments in Unreal Engine, developed materials and bound hair to the character rigs, and worked on 3D animation for the in-world film <em>Welcome to Jankspace, Babes</em>, released on DIS in 2025.</p>
  <dl class="facts">
    <dt>Role</dt><dd>3D environment artist, Unreal Engine team</dd>
    <dt>Shown</dt><dd>State of Fashion Biennale 2026, <em>Available to Promise</em>, Arnhem, Netherlands</dd>
    <dt></dt><dd><em>Infrastructures: making space for the desires of others</em>, curated by Václav Janoščík, Dům umění Ústí nad Labem, Czech Republic</dd>
    <dt>Credits</dt><dd>Game design and creative direction: Daniel Felstead. Interaction design and development: Jenn Leung. Digital fashion skins: Marie Lueder and Holly Jayne Wild.</dd>
  </dl>

<template id="t-animacy">
  <h2>Animacy 2.0</h2>
  <p class="lede">The Instant Fold series investigates the vitality of elements existing across multiple overlapping states through the exploration of images and media. Life is conceived not as a singular possibility but as a spectrum of unfolding agencies present within diverse fields.</p>
  <p>“Animacy 2.0” constructs a multidimensional ecosystem of cohabitation at the intersection of the artificial and the digital.</p>
  <p>By integrating multiple media, the boundaries between nature, technology, and consciousness become permeable, fluid, and mutable, revealing a dynamic process of continuous becoming.</p>
  <dl class="facts">
    <dt>Medium</dt><dd>Print on canvas, resin</dd>
    <dt>Format</dt><dd>Four panels, 25 × 25 cm each, hung in a single vertical column</dd>
    <dt>Shown</dt><dd><em>The Green Grammar</em>, ArtSECT Gallery, London, May 2025</dd>
    <dt></dt><dd><em>Soft Borders</em>, Bartha Contemporary, London, 12 to 15 November 2026</dd>
  </dl>
</template>

<template id="t-instant-fold">
  <h2>Instant Fold</h2>
  <p class="lede">“Instant Fold” is an experimental short film that responds to the theme of Inhumanism, exploring the integrated perspectives of non-specific life forms.</p>
  <p>The film uses a fusion of visual arts and digital technologies to present the experience of “non-human” life, aiming to blur the cognitive boundaries of human-centred understanding and challenge traditional limits of time, space and form.</p>
  <p class="quote">“We perceive the world as a container, holding constant elements whose only changes lie in the rearrangement and operational order of these elements.”</p>
  <h3>Research</h3>
  <p><b>Inhumanism</b> is a philosophical movement challenging anthropocentrism, emphasising that humans are neither the centre of the universe nor of culture. It calls for a re-evaluation of the relationship between human and non-human entities.</p>
  <p><b>Xenofeminism</b>: “Everyone has the right to speak in a non-specific capacity” and “everyone does not mean just human”. It advocates a redefinition of gender and identity, while deconstructing the binary between nature and culture.</p>
  <p><b>Animism</b> attributes souls, life forces or spiritual essences to all entities, whether biological or non-biological. Artificial intelligence, machines and even elements within virtual worlds possess a form of “existence”, with an agency of their own.</p>
  <h3>Narrative structure: field theory and becoming</h3>
  <p>The narrative revolves around the flow and diversity of life, with three core elements: Field, Wave and Echo. The film adopts a field-theory mindset: elements combine not in a linear logic but in a random and open way, so existence is no longer confined to traditional species or shapes. Life becomes a constantly shifting presence within the field.</p>
  <h3>Scene 1: Field</h3>
  <p>A field of “lost vectors”: after the collapse of human centrality, how does an individual reorient themselves in a vast non-human system? The camera starts from a micro view of the grass, zooms out to a giant horse’s eye, then pulls back to reveal an even greater entity. The space follows non-Euclidean geometry, with no fixed reference points for near or far.</p>
  <figure class="fit"><img src="img/if-03.jpg" width="2000" height="838" alt="A pale figure among white strands" loading="lazy"></figure>
  <h3>Scene 2: Wave</h3>
  <p>This scene is based on the concept of the wave and resonates with the inner perception system of animism, where the life force of material is sensed. Fragmented waves simulate the flux of particles and leaves, and plant-like structures grow on the character’s skin. The sound merges electronic synthesiser tones with natural ambient noise.</p>
  <figure class="fit"><img src="img/if-11.jpg" width="2000" height="838" alt="A face among green leaves, seen from above" loading="lazy"></figure>
  <h3>Scene 3: Echo</h3>
  <p>This scene pushes “indifference” to its peak, symbolising the dissolution of boundaries. Characters, particles and a massive planet form one space, embodying “impermanence”, the Buddhist idea that all things are in constant change, and “random folding”. Debris floating in space stands for memories and past lives, and the definition of time is blurred.</p>
  <figure class="fit"><img src="img/if-09.jpg" width="2000" height="838" alt="A pale planet on the left, a small figure among stars and debris on the right" loading="lazy"></figure>
  <h3>Character</h3>
  <p>The character is a constantly transforming organism that flows between dimensions, a hybrid of animal and plant features. It moves between three states, human, horse and centaur, shifting between the virtual and the real, the biological and the non-biological. Its skin blends liquid metal, reflective plastics and organic materials; skin and hair were built with Blender’s geometry nodes, down to the growth path of the eyelashes.</p>
  <div class="pair">
    <figure class="fit"><img src="img/if-p01.jpg" width="549" height="830" alt="Skin, hair and material tests for the character" loading="lazy"></figure>
    <figure class="fit"><img src="img/if-p04.jpg" width="543" height="762" alt="Sculpting and garment tests for the character" loading="lazy"></figure>
  </div>
  <figure class="fit"><img src="img/if-p02.jpg" width="1599" height="1021" alt="Skin detail of the character, with the node setup behind it" loading="lazy"></figure>
  <p>The skeleton was bound with AccuRig, motion was captured with an Xsens suit and retargeted in MotionBuilder, then transferred to the character in Blender, with the face rigged in Auto-Rig. Garments were simulated in Clo3D and imported as Alembic files; accessories were sculpted in ZBrush and bound to the skeleton.</p>
  <figure class="fit"><img src="img/if-p03.jpg" width="578" height="379" alt="Retargeting motion capture data in MotionBuilder" loading="lazy"></figure>
  <h3>Worldbuilding</h3>
  <p>Blender is the main tool, with Unreal Engine 5 and TouchDesigner alongside. All particle systems were simulated with Blender’s geometry nodes, and lighting and rendering were done in Cycles for a soft, tactile texture.</p>
  <div class="pair">
    <figure class="fit"><img src="img/if-p05.jpg" width="603" height="336" alt="Particle and fragment set-ups in Blender" loading="lazy"></figure>
    <figure class="fit"><img src="img/if-p06.jpg" width="596" height="336" alt="Leaf particles and nodes in Blender" loading="lazy"></figure>
  </div>
  <p>Unreal Engine 5 handled the large-scale scenes, especially the fast first-person view of the horse: the camera is bound to the horse as it runs along a set path. Plants react to the moving character through forces and collisions. TouchDesigner was used for creative programming, generating particles and dynamic simulations.</p>
  <figure class="fit"><img src="img/if-p07.jpg" width="1367" height="414" alt="The horse’s first-person camera path in Unreal Engine 5" loading="lazy"></figure>
  <figure class="fit"><img src="img/if-p08.jpg" width="1474" height="405" alt="The camera bound to the horse in Unreal Engine 5" loading="lazy"></figure>
  <figure class="fit"><img src="img/if-p09.jpg" width="629" height="952" alt="Plant materials and collisions in Unreal Engine 5" loading="lazy"></figure>
  <h3>Colour and light</h3>
  <p>Cool tones of blue, silver and green meet natural elements such as wood grain and copper, with a stark contrast of light and shadow standing for the perception of alien life forms. Light guides the perception of space as fluid, beyond the laws of physics. The film was graded twice, first in Blender’s compositor before the final render.</p>
  <dl class="facts">
    <dt>Year</dt><dd>2025</dd>
    <dt>Made with</dt><dd>Blender, Unreal Engine 5, TouchDesigner, Clo3D, ZBrush, Xsens motion capture, MotionBuilder, AccuRig</dd>
    <dt>Shown</dt><dd>Flair Fashion, London, 2025</dd>
  </dl>

<template id="t-about">
  <h2>About</h2>
  <p class="lede">My work explores animacy: the moment something without a body, or something we don’t usually consider alive, begins to feel present. I call this moment the Instant Fold.</p>
  <p>I grew up in a Buddhist family. When I was little, I used to water the flowers, and my mother would tell me that the gurgling sound was the flowers drinking. It was a small thing, but it shaped the way I came to see the world. It made me more aware of the life and presence in things around me, even those we don’t usually think of as living.</p>
  <p>I see life as being made up of countless moments. Some pass without notice, while others stay with us and quietly shape the way we remember, perceive and understand the world. I’m interested in these brief moments of transformation, when our perception of something shifts and something previously overlooked becomes present.</p>
  <p>I explore these ideas through digital media, working with real-time 3D, motion capture, generative media and hand-finished resin. I’m interested in the space between the real and the imagined, and in how something can feel both like an illusion and an experience that is genuinely happening.</p>
  <p>Light, sound, music and moving images are central to my practice. I’m drawn to the intimate and almost illusory quality of a moment shaped by light: a brief encounter in which the outside world seems to fall away, leaving only what is in front of us.</p>
  <p>The Instant Fold series investigates the vitality of elements existing across multiple overlapping states through the exploration of images and media. Life is conceived not as a singular possibility but as a spectrum of unfolding agencies present within diverse fields.</p>

<script>
(function () {
  // [src, width, height, alt text for screen readers, visible caption (only size and material)]
  var WORKS = {
    "fifth-season": {
      title: "The Fifth Season", kicker: "Latest work · Instant Fold, in development", short: "In development",
      images: [
        ["img/fs-f1.jpg", 1920, 1080, "Dusk. The crystal brim from the fisheye camera above her head"],
        ["img/fs-f2.jpg", 1920, 1080, "Night. Looking down through the brim, the generated life around her"],
        ["img/fs-2.jpg", 1920, 1080, "Dusk. Shot 2 of 7, low, at the water. Blender test render"],
        ["img/fs-3.jpg", 1920, 1080, "Night. Shot 3 of 7, close. Blender test render"],
        ["img/fs-4.jpg", 1920, 1080, "Night. Shot 4 of 7, from above. Blender test render"],
        ["img/fs-5.jpg", 1920, 1080, "Night. Shot 5 of 7, the fold. Blender test render"],
        ["img/fs-6.jpg", 1920, 1080, "Dawn. Shot 6 of 7, low, at the water. Blender test render"],
        ["img/fs-f3.jpg", 1920, 1080, "Night. The ring of beads from the fisheye camera above her head"],
        ["img/fs-f4.jpg", 1920, 1080, "Night. The brim and its strands, lit from above"]
      ]
    },
    "hero-mother": {
      title: "Hero, Mother", kicker: "2026", short: "2026",
      images: [
        ["img/hm-01.jpg", 1231, 748, "Black and white lace over a figure with long pale hair"],
        ["img/hm-02.jpg", 1200, 647, "White lace over a figure holding a sword"]
      ]
    },
    "jankspace": {
      title: "Jankspace", kicker: "Collaboration · 2026", short: "2026",
      images: [
        ["img/jk-01.jpg", 1920, 1080, "The digital twin, fallen in a showroom. Unreal Engine"],
        ["img/jk-02.jpg", 1641, 895, "The crimson showroom environment. Unreal Engine, work in progress"],
        ["img/jk-03.jpg", 1134, 639, "The digital twin, close up"],
        ["img/jk-04.jpg", 1716, 861, "The digital twin lying on the showroom floor"],
        ["img/jk-05.jpg", 1554, 756, "Face, hair and lashes, close up. Work in progress"],
        ["img/jk-06.jpg", 1199, 619, "The digital twin seen from above. Work in progress"]
      ]
    },
    "animacy": {
      title: "Animacy 2.0", kicker: "Instant Fold · 2025", short: "2025",
      images: [
        ["img/an-01.jpg", 800, 1085, "Installation view: four panels hung in a single column"],
        ["img/an-02.jpg", 1000, 1000, "Panel I", "Print on canvas, resin, 25 × 25 cm"],
        ["img/an-03.jpg", 1000, 1000, "Panel II", "Print on canvas, resin, 25 × 25 cm"],
        ["img/an-04.jpg", 1000, 1000, "Panel III", "Print on canvas, resin, 25 × 25 cm"],
        ["img/an-05.jpg", 1000, 1000, "Panel IV", "Print on canvas, resin, 25 × 25 cm"]
      ]
    },
    "wonderland": {
      title: "Wonderland", kicker: "Moving image · 2024", short: "2024",
      images: [
        ["img/il-01.jpg", 549, 275, "A koi passes in front of her face"],
        ["img/il-02.jpg", 550, 276, "A hand reaching into open sky"],
        ["img/il-03.jpg", 548, 275, "A snail crossing her palm"],
        ["img/il-04.jpg", 549, 275, "Light through green water"],
        ["img/il-05.jpg", 535, 268, "Her face, out of focus, under water"],
        ["img/il-06.jpg", 548, 275, "Her face as a desktop: folders and a balance"]
      ]
    },
    "instant-fold": {
      title: "Instant Fold", kicker: "Short film · 2025", short: "2025",
      images: [
        ["img/if-01.jpg", 2000, 532, "A giant figure lying across a city, seen from above"],
        ["img/if-02.jpg", 2000, 297, "Giant figures among the towers"],
        ["img/if-03.jpg", 2000, 838, "A pale figure among white strands"],
        ["img/if-04.jpg", 2000, 838, "A blue face, and a small figure reaching out beside it"],
        ["img/if-05.jpg", 2000, 838, "A figure among drifting points of light"],
        ["img/if-06.jpg", 2000, 838, "A silvery face beside the eye of a white horse"],
        ["img/if-07.jpg", 2000, 838, "A face in a cold light"],
        ["img/if-08.jpg", 2000, 838, "A figure falling past a pale planet"],
        ["img/if-09.jpg", 2000, 838, "A pale planet over a field of stars"],
        ["img/if-10.jpg", 2000, 838, "Title card for the scene Echo"]
      ]
    }
  };
  var ORDER = ["fifth-season", "hero-mother", "jankspace", "animacy", "wonderland", "instant-fold"];
  var PAGES = { about: "About", contact: "Contact" };
  // each work's ground and accent, taken from the main colour of its images
  var TONE = {
    "fifth-season": ["#141a1f", "#e9d5aa"],
    "hero-mother": ["#1b1c1e", "#d9dde3"],
    "jankspace": ["#3b0c0e", "#ff9d92"],
    "animacy": ["#0f1e2b", "#d6de8e"],
    "wonderland": ["#0f241d", "#e8c47c"],
    "instant-fold": ["#171a33", "#bccbff"],
    "about": ["#0b0e0d", "#e9d5aa"],
    "contact": ["#0b0e0d", "#e9d5aa"]
  };

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement, poster = $("poster");
  var cur = "fifth-season", idx = 0, lock = false;

  $("index").innerHTML = ORDER.map(function (k) {
    return '<li><a href="#' + k + '" data-work="' + k + '"><b>' + WORKS[k].title + '</b><small>' + WORKS[k].short + '</small></a></li>';
  }).join("");

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

  function tone(k) {
    var t = TONE[k] || TONE.about;
    root.style.setProperty("--bg", t[0]);
    root.style.setProperty("--accent", t[1]);
  }

  // ---------- home: the poster
  function paint() {
    var w = WORKS[cur], im = w.images[idx], n = w.images.length;
    var img = $("posterImg");
    img.src = im[0]; img.width = im[1]; img.height = im[2]; img.alt = im[3];
    $("title").textContent = w.title;
    $("kicker").textContent = w.kicker;
    $("read").href = "#" + cur;
    $("num").innerHTML = "<b>" + pad(idx + 1) + "</b> / " + pad(n);
    $("what").textContent = im[4] || "";
    $("prev").hidden = $("next").hidden = n < 2;
    document.querySelectorAll("[data-work]").forEach(function (a) { a.classList.toggle("on", a.dataset.work === cur); });
    tone(cur);
  }
  function setWork(k) { if (k !== cur) { cur = k; idx = 0; paint(); } }
  function turn(step) {
    var n = WORKS[cur].images.length;
    if (n < 2 || lock) return;
    lock = true; setTimeout(function () { lock = false; }, 350);
    idx = (idx + step + n) % n; paint();
  }

  var fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (!fine) poster.classList.remove("pointer");
  document.querySelectorAll("[data-work]").forEach(function (a) {
    a.addEventListener("mouseenter", function () { if (fine) setWork(a.dataset.work); });
    a.addEventListener("focus", function () { setWork(a.dataset.work); });
  });

  var acc = 0, accT = 0;
  window.addEventListener("wheel", function (e) {
    if (!root.classList.contains("home")) return;
    e.preventDefault();
    var now = Date.now(); if (now - accT > 220) acc = 0; accT = now;
    acc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (Math.abs(acc) > 40) { turn(acc > 0 ? 1 : -1); acc = 0; }
  }, { passive: false });
  var down = null, moved = false;
  poster.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY }; moved = false; });
  poster.addEventListener("pointermove", function (e) {
    var c = $("cursor"), half = e.clientX < innerWidth / 2;
    c.style.left = e.clientX + "px"; c.style.top = e.clientY + "px";
    c.textContent = half ? "← Previous" : "Next →";
    c.classList.toggle("on", fine && WORKS[cur].images.length > 1);
    if (down && Math.abs(e.clientX - down.x) > 8) moved = true;
  });
  poster.addEventListener("pointerleave", function () { $("cursor").classList.remove("on"); });
  poster.addEventListener("pointerup", function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { turn(dx < 0 ? 1 : -1); return; }
    if (!moved) turn(e.clientX < innerWidth / 2 ? -1 : 1);
  });
  $("prev").addEventListener("click", function () { turn(-1); });
  $("next").addEventListener("click", function () { turn(1); });
  document.addEventListener("keydown", function (e) {
    if (!root.classList.contains("home")) { if (e.key === "Escape") location.hash = ""; return; }
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); turn(1); }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); turn(-1); }
  });

  // ---------- article: the long read
  function fig(im) {
    var cls = im[2] > im[1] * 1.05 ? "tall" : (Math.abs(im[1] - im[2]) < im[1] * 0.05 ? "sq" : "");
    return '<figure class="' + cls + '"><img src="' + im[0] + '" width="' + im[1] + '" height="' + im[2] + '" alt="' + esc(im[3]) + '" loading="lazy">' + (im[4] ? '<figcaption>' + esc(im[4]) + '</figcaption>' : '') + '</figure>';
  }
  function article(k) {
    var w = WORKS[k], tpl = $("t-" + k).content.cloneNode(true), box = document.createElement("div");
    box.appendChild(tpl);
    var h2 = box.querySelector("h2"); if (h2) h2.remove();
    var html = "";
    if (w && w.images.length) {
      var hero = w.images[0];
      html += '<figure class="hero"><img src="' + hero[0] + '" width="' + hero[1] + '" height="' + hero[2] + '" alt="' + esc(hero[3]) + '"><div class="veil"></div>' +
        '<div class="hero-text"><span class="label">' + esc(w.kicker) + '</span><h1>' + esc(w.title) + '</h1></div></figure>';
    } else {
      html += '<header class="plain-head"><span class="label">' + (w ? esc(w.kicker) : "") + '</span><h1>' + (w ? esc(w.title) : PAGES[k]) + '</h1></header>';
    }
    // text, with the work's images set between the paragraphs
    var custom = !!box.querySelector("figure");
    var rest = w && !custom ? w.images.slice(1) : [], out = '<div class="body">', col = "";
    var flush = function () { if (col) { out += '<div class="col">' + col + '</div>'; col = ""; } };
    Array.prototype.forEach.call(box.children, function (el, i) {
      if (el.tagName === "FIGURE" || el.classList.contains("pair")) { flush(); out += el.outerHTML; return; }
      col += el.outerHTML;
      if (el.tagName === "P" && rest.length && i > 0) {
        flush();
        if (rest.length >= 2 && rest[0][2] > rest[0][1] * 0.9 && rest[1][2] > rest[1][1] * 0.9) out += '<div class="pair">' + fig(rest.shift()) + fig(rest.shift()) + '</div>';
        else out += fig(rest.shift());
      }
    });
    flush();
    while (rest.length) {
      if (rest.length >= 2 && rest[0][2] >= rest[0][1] * 0.9 && rest[1][2] >= rest[1][1] * 0.9) out += '<div class="pair">' + fig(rest.shift()) + fig(rest.shift()) + '</div>';
      else out += fig(rest.shift());
    }
    if (w) {
      var nk = ORDER[(ORDER.indexOf(k) + 1) % ORDER.length];
      out += '<nav class="next" aria-label="Next work"><span class="label">Next work</span><a href="#' + nk + '">' + esc(WORKS[nk].title) + '</a></nav>';
    }
    out += '</div>';
    $("article").innerHTML = html + out;
    tone(k);
  }

  function route() {
    var h = (location.hash || "").slice(1);
    var open = WORKS[h] || PAGES[h];
    root.classList.toggle("home", !open);
    root.classList.toggle("article", !!open);
    $("home").hidden = !!open;
    $("article").hidden = !open;
    document.querySelectorAll("[data-page]").forEach(function (a) { a.classList.toggle("on", a.dataset.page === h); });
    if (open) { article(h); window.scrollTo(0, 0); }
    else { if (WORKS[cur]) paint(); }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
