<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qianyu Wang</title>
<meta name="description" content="Qianyu (Nova) Wang, multimedia artist working with animacy: moving image, real-time 3D and generative media.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the home page is an interactive poster: one image fills the screen, light type sits on it, and the
   index of works floats on the left. Hover a work to put it on the poster; scroll, drag or click to leaf through.
   Opening a work turns the page into a long article on a ground taken from that work's main colour.
   Single dark look, by choice. Images never animate. */
:root {
  --night: #0b0e0d;
  --bg: #0b0e0d;            /* set per work in article view */
  --ink: #f3efe6;
  --soft: rgba(243, 239, 230, 0.8);
  --muted: rgba(243, 239, 230, 0.62);
  --rule: rgba(243, 239, 230, 0.2);
  --accent: #e9d5aa;        /* set per work */
  --tbc: #5a4f20;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gl: max(clamp(16px, 3.2vw, 44px), env(safe-area-inset-left, 0px));
  --gr: max(clamp(16px, 3.2vw, 44px), env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 1rem/1.65 var(--serif); -webkit-font-smoothing: antialiased; }
html.home, html.home body { height: 100%; overflow: hidden; overflow: clip; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 0.95; text-wrap: balance; }
img { max-width: 100%; display: block; }
.label { font: 500 0.72rem/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.tbc { background: var(--tbc); padding: 0 0.25em; border-radius: 2px; }
.view[hidden] { display: none !important; }

/* top bar, shared */
.top { position: fixed; z-index: 10; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px 24px; flex-wrap: wrap;
  padding: calc(18px + env(safe-area-inset-top, 0px)) var(--gr) 18px var(--gl); pointer-events: none; text-shadow: 0 1px 18px rgba(0, 0, 0, 0.45); }
.top > * { pointer-events: auto; }
.me { display: grid; gap: 4px; }
.me a { font: 400 1.7rem/1 var(--display); }
.nav { display: flex; gap: 22px; flex-wrap: wrap; }
.nav a { font: 500 0.72rem/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
.nav a:hover, .nav a.on { color: var(--ink); }
html.article .top { background: var(--bg); text-shadow: none; }

/* home: the poster */
.poster { position: fixed; inset: 0; background: var(--night); overflow: hidden; touch-action: pan-y; user-select: none; }
.poster img { width: 100%; height: 100%; max-width: none; object-fit: cover; pointer-events: none; }
.veil { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(4, 6, 6, 0.42) 0%, rgba(4, 6, 6, 0.12) 38%, rgba(4, 6, 6, 0) 60%),
              linear-gradient(0deg, rgba(4, 6, 6, 0.38) 0%, rgba(4, 6, 6, 0) 34%); }
.works { position: fixed; z-index: 5; left: var(--gl); top: 50%; transform: translateY(-50%); display: grid; gap: 2px; text-shadow: 0 1px 20px rgba(0, 0, 0, 0.5); }
.works ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 0; }
.works a { display: flex; align-items: baseline; gap: 12px; padding: 3px 0; }
.works b { font: 400 clamp(1.5rem, 2.6vw, 2.3rem)/1.08 var(--display); color: var(--soft); }
.works small { font: 400 0.68rem/1 var(--mono); letter-spacing: 0.08em; color: var(--muted); }
.works a:hover b, .works a.on b { color: var(--ink); }
.works a.on b { font-style: italic; }
.poster-foot { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px;
  padding: 0 var(--gr) calc(22px + env(safe-area-inset-bottom, 0px)) var(--gl); pointer-events: none; }
.poster-foot > * { pointer-events: auto; }
.headline { display: grid; gap: 10px; min-width: 0; }
.headline h1 { font-size: clamp(3.4rem, 11.5vw, 11rem); line-height: 0.86; color: rgba(243, 239, 230, 0.94); mix-blend-mode: screen; letter-spacing: -0.01em; }
.read { font: 500 0.75rem/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); justify-self: start; text-shadow: 0 1px 14px rgba(0, 0, 0, 0.5); }
.read:hover { text-decoration: underline; text-underline-offset: 5px; }
.count { display: grid; justify-items: end; gap: 8px; text-align: right; text-shadow: 0 1px 14px rgba(0, 0, 0, 0.55); }
.count .n { font: 400 0.82rem/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }
.count .n b { font-weight: 500; color: var(--accent); }
.count .what { font: 400 0.72rem/1.45 var(--mono); color: var(--soft); max-width: 34ch; }
.arrows { display: flex; gap: 6px; }
.arrows button { width: 36px; height: 36px; border: 1px solid rgba(243, 239, 230, 0.35); border-radius: 50%; display: grid; place-items: center; font: 400 0.9rem/1 var(--mono); }
.arrows button:hover { border-color: var(--ink); }
.cursor { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; font: 500 0.68rem/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink);
  opacity: 0; transform: translate(-50%, -50%); white-space: nowrap; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6); }
.cursor.on { opacity: 1; }
.poster.pointer { cursor: none; }

/* article */
.article-view { position: relative; }
.hero { position: relative; height: 100vh; height: 100svh; margin: 0; background: var(--bg); }
.hero img { width: 100%; height: 100%; max-width: none; object-fit: cover; }
.hero .veil { background: linear-gradient(0deg, var(--bg) 0%, rgba(0, 0, 0, 0) 45%); }
.hero-text { position: absolute; left: var(--gl); right: var(--gr); bottom: clamp(28px, 6vh, 64px); display: grid; gap: 12px; }
.hero-text h1 { font-size: clamp(3.2rem, 9vw, 8.5rem); line-height: 0.88; }
/* phones: a wide hero (heroFull) is shown whole, with the title under it instead of over it */
@media (max-width: 720px) {
  .hero.full { height: auto; padding-top: var(--toph, 112px); }
  .hero.full img { height: auto; object-fit: contain; }
  .hero.full .veil { display: none; }
  .hero.full .hero-text { position: static; padding: 28px 0 8px; margin: 0 var(--gr) 0 var(--gl); }
}
.plain-head { padding: calc(120px + env(safe-area-inset-top, 0px)) var(--gr) 24px var(--gl); display: grid; gap: 12px; }
.plain-head h1 { font-size: clamp(3rem, 8vw, 7rem); }
.body { padding: 24px var(--gr) 96px var(--gl); display: grid; gap: 40px; }
.body .col { max-width: 40rem; display: grid; gap: 18px; }
.body p { font-size: 1.08rem; color: var(--soft); }
.body p.lede { font: 400 clamp(1.5rem, 2.4vw, 2rem)/1.3 var(--display); color: var(--ink); }
.body figure { margin: 0; display: grid; gap: 8px; }
.body figure img { width: 100%; height: auto; }
.body figure.tall img, .body figure.sq img { width: auto; max-height: 88vh; max-width: 100%; }
.body h3 { font: 400 clamp(1.7rem, 2.6vw, 2.3rem)/1.1 var(--display); margin: 22px 0 0; color: var(--ink); }
.body p.quote { font: italic 400 1.25rem/1.45 var(--display); color: var(--ink); border-left: 1px solid var(--accent); padding-left: 16px; }
.refs { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 0.88rem; color: var(--muted); }
.body figure.fit img { width: auto; max-width: 100%; max-height: 82vh; }
.body figcaption { font: 400 0.72rem/1.5 var(--mono); color: var(--muted); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.seq { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seq.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seq.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.seq figure { margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 64rem; }
.tiles figure { margin: 0; }
.tiles img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
.palette { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0; }
.palette li { display: grid; gap: 2px; }
.palette .chip { display: block; height: 22px; }
.palette b { font: 400 0.85rem/1.2 var(--display); color: var(--ink); padding: 6px 8px 0 0; }
.palette code { font: 400 0.62rem/1.4 var(--mono); letter-spacing: 0.06em; color: var(--muted); }
.seq img { width: 100%; height: auto; display: block; }
.seq.record { gap: 10px; max-width: 76rem; }
.flow > p { margin: 0 0 18px; }
.flow > p:last-child { margin-bottom: 0; }
.flow .portrait { float: right; width: 220px; height: auto; margin: 6px 0 14px 24px; }
@media (max-width: 720px) { .flow .portrait { width: 38%; margin: 4px 0 10px 16px; } }
@media (min-width: 1100px) { .flow { position: relative; } .flow .portrait { float: none; position: absolute; top: 6px; left: calc(100% + 72px); width: min(340px, calc(100vw - 40rem - 220px)); margin: 0; } }
.seq.duo { display: flex; gap: 10px; max-width: 76rem; align-items: flex-start; }
.seq.duo img { width: 0; min-width: 0; height: auto; flex-basis: 0; }
.body figure.one { max-width: 76rem; }
.seq.slips { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; max-width: 76rem; align-items: start; }
.seq.slips a { display: block; }
.seq.slips img { width: 100%; height: auto; }
@media (max-width: 720px) { .seq.slips { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } }
.seq.duo > a { display: block; min-width: 0; flex-basis: 0; }
.seq.duo > a img { width: 100%; height: auto; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 8px 0 0; padding-top: 14px; border-top: 1px solid var(--rule); max-width: 40rem; }
.facts dt { font: 500 0.7rem/1.75 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-size: 0.95rem; color: var(--soft); min-width: 0; }
.cv { display: grid; gap: 4px; border-top: 1px solid var(--rule); padding-top: 14px; max-width: 46rem; }
.cv div { display: grid; grid-template-columns: 4.4rem minmax(0, 1fr); gap: 14px; font-size: 0.95rem; padding: 4px 0; color: var(--soft); }
.cv span:first-child { white-space: nowrap; font: 400 0.78rem/1.9 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.big { font: 400 clamp(1.8rem, 4vw, 3rem)/1.2 var(--display); color: var(--ink); }
.body a { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.body a:hover { text-decoration-color: var(--accent); }
.next { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 22px; }
.next a { text-decoration: none; font: 400 clamp(2rem, 5vw, 3.6rem)/1 var(--display); }
.next a:hover { color: var(--accent); }

@media (max-width: 720px) {
  .works { top: calc(96px + env(safe-area-inset-top, 0px)); transform: none; }
  .headline .label { display: none; }
  .works b { font-size: 1.35rem; }
  .works small { display: none; }
  .headline h1 { font-size: clamp(2.6rem, 13vw, 4rem); }
  .count .what { display: none; }
  .pair { grid-template-columns: minmax(0, 1fr); }
  .seq, .seq.five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seq.three { grid-template-columns: minmax(0, 1fr); }
  .tiles { gap: 8px; }
  .palette { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 18px; }
  .palette .chip { height: 18px; }
  .top { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .me a { font-size: 1.45rem; }
  .nav { gap: 14px; }
}
</style>

<template id="t-fifth-season">
  <h2>The Fifth Season</h2>
  <p class="quote">不生不灭，不垢不净，不增不减<br>Neither arising nor ceasing, neither defiled nor pure, neither increasing nor decreasing.<br><span style="font-style:normal;font-size:0.8em">The Heart Sutra</span></p>
  <p class="lede"><em>The Fifth Season</em> exists somewhere between day and night, between one season and another. It is a field in which things are never quite still, even when nothing seems to move.</p>
  <figure><img src="img/fs-clay-grid.jpg" width="2000" height="1130" alt="White model of the scene, nine cameras, one frame each: wide, low, close, from above, orbiting, two at her head and two across the pond. Blender test render" loading="lazy"></figure>
  <figure><img src="img/fs-cover-63.jpg" width="960" height="540" alt="Night. From above, a fixed spot on the water, the crystal brim crossing its edge" loading="lazy"></figure>
  <p>A fixed point on the surface of the water. Light rests on its edge, revealing something that is almost there, almost imagined.</p>
  <figure><img src="img/fs-2.jpg" width="1920" height="1080" alt="Dusk. Shot 2 of 7, low, at the water. Blender test render" loading="lazy"></figure>
  <p>Day turns into night, and night returns to day. The surroundings shift, and so does the way we perceive them. The mind turns with its surroundings; the surroundings turn with the mind.</p>
  <p>心随境转，境随心转。</p>
  <figure><img src="img/fs-3.jpg" width="1920" height="1080" alt="Night. Shot 3 of 7, close. Blender test render" loading="lazy"></figure>
  <p>Set in a prolonged summer, <em>The Fifth Season</em> inhabits a time outside the familiar rhythm of seasons. It is neither an arrival nor an ending, but a space in between, where light, matter and perception quietly change.</p>
  <figure><img src="img/fs-4.jpg" width="1920" height="1080" alt="Night. Shot 4 of 7, from above. Blender test render" loading="lazy"></figure>
  <p>Nothing arises and nothing ceases. Still, the light keeps changing.</p>
  <div class="pair">
    <figure><img src="img/fs-p11.jpg" width="960" height="540" alt="From above, a strong spot on the water below her" loading="lazy"></figure>
    <figure><img src="img/fs-p19.jpg" width="960" height="540" alt="From above, the spot's pool of light filling the frame" loading="lazy"></figure>
  </div>
  <figure><img src="img/fs-5.jpg" width="1920" height="1080" alt="Night. Shot 5 of 7, the fold. Blender test render" loading="lazy"></figure>

    <figure><img src="img/fs-q53.jpg" width="960" height="540" alt="Sequence, frame 7: from above, the spot on the water, the brim turning" loading="lazy"></figure>
    <figure><img src="img/fs-q54.jpg" width="960" height="540" alt="Sequence, frame 8: from above, the spot on the water, the brim turning" loading="lazy"></figure>

<template id="t-form-that-remains">
  <h2>A Form That Remains</h2>
  <h3>Observation record</h3>
  <figure class="one"><a href="img/lf-observation-sheet.jpg" target="_blank" rel="noopener"><img src="img/lf-observation-sheet.jpg" width="2000" height="710" alt="Fourteen black-and-white photographs of the fern in its pot over the months of observation, from new croziers to full, arching fronds" loading="lazy"></a></figure>
  <div class="seq slips"><a href="img/lf-slip-01.jpg" target="_blank" rel="noopener"><img src="img/lf-slip-01.jpg" width="660" height="1140" alt="Handwritten note 1 of 6, on a paper slip: Halo, little one. I wonder how long you&#39;ve been there before I found u" loading="lazy"></a><a href="img/lf-slip-02.jpg" target="_blank" rel="noopener"><img src="img/lf-slip-02.jpg" width="660" height="858" alt="Handwritten note 2 of 6, on a paper slip: You looks so quiet today..." loading="lazy"></a><a href="img/lf-slip-03.jpg" target="_blank" rel="noopener"><img src="img/lf-slip-03.jpg" width="660" height="858" alt="Handwritten note 3 of 6, on a paper slip: How r u today? I&#39;m sad a bit..." loading="lazy"></a><a href="img/lf-slip-04.jpg" target="_blank" rel="noopener"><img src="img/lf-slip-04.jpg" width="660" height="1232" alt="Handwritten note 4 of 6, on a paper slip: Are u still the same leaf? Sry been long time to talk to u. I&#39;m back.. I know something is different." loading="lazy"></a><a href="img/lf-slip-05.jpg" target="_blank" rel="noopener"><img src="img/lf-slip-05.jpg" width="660" height="858" alt="Handwritten note 5 of 6, on a paper slip: I didn&#39;t sleep very well last night. How r u today?" loading="lazy"></a><a href="img/lf-slip-06.jpg" target="_blank" rel="noopener"><img src="img/lf-slip-06.jpg" width="660" height="1200" alt="Handwritten note 6 of 6, on a paper slip: When did you stop being alive? I mean.. you just looks same, haven&#39;t changed very much on the outside" loading="lazy"></a></div>
  <div class="seq duo"><img src="img/lf-box.jpg" width="1672" height="941" style="flex-grow:1.777" alt="The resin-coated branch and leaves lying in a clear acrylic box, seen at an angle" loading="lazy"><img src="img/lf-box-top.jpg" width="1448" height="1086" style="flex-grow:1.333" alt="The resin-coated branch and leaves in the clear acrylic box, seen from above" loading="lazy"></div>
  <p class="lede"><em>A Form That Remains</em> is an ongoing study of time, materiality and the persistence of form.</p>
  <p>What appears unchanged is, in fact, no longer the same. Dried, a leaf keeps the outline it had when it was alive: the edges, the veins, the way it curls. A photograph can hardly tell the two states apart. Only the hand knows. What was soft has become dry, light and brittle.</p>
  <div class="seq duo"><img src="img/lf-02-bw.jpg" width="1600" height="1600" style="flex-grow:1.000" alt="Detail: clear resin along a leaf edge, its shadow crossed by lines of light" loading="lazy"><img src="img/lf-03-bw.jpg" width="1200" height="1600" style="flex-grow:0.750" alt="From above, the leaves and their resin skin curve into a crescent, with sharp shadows on the paper" loading="lazy"><img src="img/lf-04-bw.jpg" width="1600" height="1200" style="flex-grow:1.333" alt="Detail: the resin-coated stem bends and casts a thin shadow inside the circle of light" loading="lazy"></div>
  <p>The work stays with this quiet change. Not the drama of growing and dying, but the moment when a form persists while the matter inside it has already moved on.</p>
  <figure class="one"><img src="img/lf-06-bw.jpg" width="1600" height="923" alt="Detail: leaves, the resin-coated stem and their shadows" loading="lazy"></figure>
  <p>Resin runs over the leaves and along the branch, and hardens into a clear skin. It does not keep the plant as it was. Leaf and resin become one body, something between a natural specimen and a constructed object: no longer only a plant, not only a material, but a new form of presence.</p>
  <div class="seq duo"><img src="img/lf-05-bw.jpg" width="1600" height="1200" style="flex-grow:1.333" alt="The leaves curl into a crescent, the clear resin stem stretched out to the right" loading="lazy"><img src="img/lf-07-bw.jpg" width="1200" height="1600" style="flex-grow:0.750" alt="The leaves seen from above, the stem running down the page, coated in clear resin" loading="lazy"><img src="img/lf-08-bw.jpg" width="1250" height="1600" style="flex-grow:0.781" alt="Detail: the thin resin-coated stem and its shadow" loading="lazy"></div>
  <p>To preserve a moment is also to interrupt its continuation. Here, the interruption is also a beginning. Rather than holding on to life itself, the work gives a moment of existence another material form.</p>
  <p>Image and object hold time differently. The photographs keep the moments the leaves passed through; the resin keeps what they have become.</p>
  <p>How does a form remain present while its state continues to change?</p>
  <dl class="facts">
    <dt>Status</dt><dd>Ongoing</dd>
    <dt>Medium</dt><dd>Leaves, branch, resin</dd>
  </dl>

<template id="t-instant-fold">
  <h2>Instant Fold</h2>
  <p class="lede">“Instant Fold” is an experimental short film that responds to the theme of Inhumanism, exploring the integrated perspectives of non-specific life forms.</p>
  <p>The film uses a fusion of visual arts and digital technologies to present the experience of “non-human” life, aiming to blur the cognitive boundaries of human-centred understanding and challenge traditional limits of time, space and form.</p>
  <p class="quote">“We perceive the world as a container, holding constant elements whose only changes lie in the rearrangement and operational order of these elements.”</p>
  <h3>Research</h3>
  <p><b>Inhumanism</b> is a philosophical movement challenging anthropocentrism, emphasising that humans are neither the centre of the universe nor of culture. It calls for a re-evaluation of the relationship between human and non-human entities.</p>
  <p><b>Xenofeminism</b>: “Everyone has the right to speak in a non-specific capacity” and “everyone does not mean just human”. It advocates a redefinition of gender and identity, while deconstructing the binary between nature and culture.</p>
  <p><b>Animism</b> attributes souls, life forces or spiritual essences to all entities, whether biological or non-biological. Artificial intelligence, machines and even elements within virtual worlds possess a form of “existence”, with an agency of their own.</p>
  <h3>Narrative structure: field theory and becoming</h3>
  <p>The narrative revolves around the flow and diversity of life, with three core elements: Field, Wave and Echo. The film adopts a field-theory mindset: elements combine not in a linear logic but in a random and open way, so existence is no longer confined to traditional species or shapes. Life becomes a constantly shifting presence within the field.</p>
  <h3>Scene 1: Field</h3>
  <p>A field of “lost vectors”: after the collapse of human centrality, how does an individual reorient themselves in a vast non-human system? The camera starts from a micro view of the grass, zooms out to a giant horse’s eye, then pulls back to reveal an even greater entity. The space follows non-Euclidean geometry, with no fixed reference points for near or far.</p>
  <figure class="fit"><img src="img/if-03.jpg" width="2000" height="838" alt="A pale figure among white strands" loading="lazy"></figure>
  <div class="seq three">
    <figure><img src="img/if-653.jpg" width="1200" height="511" alt="A giant body lying among the towers of a city" loading="lazy"></figure>
    <figure><img src="img/if-654.jpg" width="1200" height="511" alt="A giant figure under a slab, scaffolding across her skin" loading="lazy"></figure>
    <figure><img src="img/if-655.jpg" width="1200" height="511" alt="An arm reaching across scaffolding, seen through the dark" loading="lazy"></figure>
  </div>
  <h3>Scene 2: Wave</h3>
  <p>This scene is based on the concept of the wave and resonates with the inner perception system of animism, where the life force of material is sensed. Fragmented waves simulate the flux of particles and leaves, and plant-like structures grow on the character’s skin. The sound merges electronic synthesiser tones with natural ambient noise.</p>
  <figure class="fit"><img src="img/if-11.jpg" width="2000" height="838" alt="A face among green leaves, seen from above" loading="lazy"></figure>
  <div class="seq three">
    <figure><img src="img/if-633.jpg" width="1200" height="511" alt="A small figure falling through the dark" loading="lazy"></figure>
    <figure><img src="img/if-634.jpg" width="1200" height="511" alt="A face tipped back, the skin mottled like bark" loading="lazy"></figure>
    <figure><img src="img/if-635.jpg" width="1200" height="511" alt="A figure lying among dark leaves" loading="lazy"></figure>
  </div>
  <h3>Scene 3: Echo</h3>
  <p>This scene pushes “indifference” to its peak, symbolising the dissolution of boundaries. Characters, particles and a massive planet form one space, embodying “impermanence”, the Buddhist idea that all things are in constant change, and “random folding”. Debris floating in space stands for memories and past lives, and the definition of time is blurred.</p>
  <figure class="fit"><img src="img/if-645.jpg" width="2400" height="1022" alt="A figure falling against a bright planet, debris all around" loading="lazy"></figure>
  <figure class="fit"><img src="img/if-08-hd.jpg" width="2400" height="1022" alt="A figure with arms spread, seen from below against a pale planet" loading="lazy"></figure>
  <figure class="fit"><img src="img/if-09-hd.jpg" width="2400" height="1022" alt="A pale planet on the left, a small figure among stars and debris on the right" loading="lazy"></figure>
  <h3>Character</h3>
  <p>The character is a constantly transforming organism that flows between dimensions, a hybrid of animal and plant features. It moves between three states, human, horse and centaur, shifting between the virtual and the real, the biological and the non-biological. Its skin blends liquid metal, reflective plastics and organic materials; skin and hair were built with Blender’s geometry nodes, down to the growth path of the eyelashes.</p>
  <div class="pair">
    <figure class="fit"><img src="img/if-p01.jpg" width="549" height="830" alt="Skin, hair and material tests for the character" loading="lazy"></figure>
    <figure class="fit"><img src="img/if-p04.jpg" width="543" height="762" alt="Sculpting and garment tests for the character" loading="lazy"></figure>
  </div>
  <figure class="fit"><img src="img/if-p02.jpg" width="1599" height="1021" alt="Skin detail of the character, with the node setup behind it" loading="lazy"></figure>
  <p>The skeleton was bound with AccuRig, motion was captured with an Xsens suit and retargeted in MotionBuilder, then transferred to the character in Blender, with the face rigged in Auto-Rig. Garments were simulated in Clo3D and imported as Alembic files; accessories were sculpted in ZBrush and bound to the skeleton.</p>
  <figure class="fit"><img src="img/if-p03.jpg" width="578" height="379" alt="Retargeting motion capture data in MotionBuilder" loading="lazy"></figure>
  <h3>Worldbuilding</h3>
  <p>Blender is the main tool, with Unreal Engine 5 and TouchDesigner alongside. All particle systems were simulated with Blender’s geometry nodes, and lighting and rendering were done in Cycles for a soft, tactile texture.</p>
  <div class="pair">
    <figure class="fit"><img src="img/if-p05.jpg" width="603" height="336" alt="Particle and fragment set-ups in Blender" loading="lazy"></figure>
    <figure class="fit"><img src="img/if-p06.jpg" width="596" height="336" alt="Leaf particles and nodes in Blender" loading="lazy"></figure>
  </div>
  <p>Unreal Engine 5 handled the large-scale scenes, especially the fast first-person view of the horse: the camera is bound to the horse as it runs along a set path. Plants react to the moving character through forces and collisions. TouchDesigner was used for creative programming, generating particles and dynamic simulations.</p>
  <figure class="fit"><img src="img/if-p07.jpg" width="1367" height="414" alt="The horse’s first-person camera path in Unreal Engine 5" loading="lazy"></figure>
  <figure class="fit"><img src="img/if-p08.jpg" width="1474" height="405" alt="The camera bound to the horse in Unreal Engine 5" loading="lazy"></figure>
  <figure class="fit"><img src="img/if-p09.jpg" width="629" height="952" alt="Plant materials and collisions in Unreal Engine 5" loading="lazy"></figure>
  <h3>Colour and light</h3>
  <p>Cool tones of blue, silver and green meet natural elements such as wood grain and copper, with a stark contrast of light and shadow standing for the perception of alien life forms. Light guides the perception of space as fluid, beyond the laws of physics. The film was graded twice, first in Blender’s compositor before the final render.</p>

<template id="t-about">
  <h2>About</h2>
  <div class="flow"><img class="portrait" src="img/about-portrait.jpg" width="960" height="1200" alt="Qianyu Wang, seated at a glass table in a white room">
  <p class="lede">My practice explores animacy: the moment something without a body, or something we do not usually consider alive, begins to feel present. I call this moment the Instant Fold.</p>
  <p>I grew up in a Buddhist family. As a child, I used to water the flowers, and my mother would tell me that the gurgling sound was the flowers drinking. It was a small observation, but one that stayed with me and shaped how I came to understand the world. I chose to believe her, and I still find myself believing that everything has a life of its own. Life, to me, is not something possessed exclusively by certain beings and absent in others. It is something that unfolds between things, through the relationships and conditions they share.</p>
  <p>I think of life as a collection of countless moments. Some pass almost unnoticed, while others remain with us, quietly shaping how we remember, perceive and understand the world. I am drawn to the brief intervals in which perception shifts: when something familiar becomes unfamiliar, something overlooked becomes visible, or something previously understood as inert begins to feel alive. These moments are not necessarily dramatic. They often happen quietly, at the threshold between what we see and what we sense.</p>
  <p>The question that runs through my work is: when does something become present, or alive, to us, and what changes once we begin to perceive it that way? This inquiry brings me into dialogue with animism and Buddhist ideas of impermanence, as well as with questions surrounding digital bodies, artificial consciousness and the increasingly blurred boundaries between organic and technological forms of existence.</p>
  <p>These ideas have developed through a series of projects. <em>Wonderland</em> (2024) explored identity and perspective through the experience of being a giant among multiple doubles. The <em>Instant Fold</em> series began with a short film that explored the agency of non-human matter, and continued with <em>Animacy 2.0</em> (2025), an ecosystem realised through print and resin, where nature, technology and consciousness become increasingly permeable. As an environment artist on <em>Jankspace</em> (2026), I explored the construction of spaces for a digital body to inhabit. My current work, <em>The Fifth Season</em>, continues this inquiry as the next chapter of <em>Instant Fold</em>, taking the form of a two-minute looping film.</p>
  <p>I work across digital and physical media, combining real-time 3D, motion capture, generative media, moving image and hand-finished resin. I am interested in the space between the real and the imagined, and in how an image or an environment can exist somewhere between illusion and lived experience. Rather than treating digital and physical worlds as separate domains, I approach them as overlapping conditions through which different forms of presence can emerge.</p>
  <p>Light, sound, music and moving images are central to my practice. I am particularly interested in the intimate quality of a moment shaped by light: how, for a brief interval, the outside world seems to fall away, leaving only what is in front of us. It is a kind of temporary suspension, somewhere between an illusion and an experience that feels genuinely present.</p>
  <p>At its core, Instant Fold considers life not as a fixed or singular condition, but as a spectrum of unfolding agencies across different forms of existence. Through images, materials and media, I explore how these forms overlap, transform and become perceptible to us. What interests me is not simply whether something is alive, but the moment in which our understanding of it begins to change.</p>

    "animacy": ["#0f1e2b", "#d6de8e"],
    "wonderland": ["#0f241d", "#e8c47c"],
    "instant-fold": ["#171a33", "#bccbff"],
    "about": ["#0b0e0d", "#e9d5aa"],
    "contact": ["#0b0e0d", "#e9d5aa"]
  };

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement, poster = $("poster");
  // the fixed top bar's height, so a whole-image hero on phones sits just below it
  function topH() { var t = document.querySelector(".top"); if (t) root.style.setProperty("--toph", (t.offsetHeight + 8) + "px"); }
  topH(); addEventListener("resize", topH); if (document.fonts) document.fonts.ready.then(topH);
  var cur = "fifth-season", idx = 0, lock = false;

  $("index").innerHTML = ORDER.map(function (k) {
    return '<li><a href="#' + k + '" data-work="' + k + '"><b>' + WORKS[k].title + '</b><small>' + WORKS[k].short + '</small></a></li>';
  }).join("");

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

  function tone(k) {
    var t = TONE[k] || TONE.about;
    root.style.setProperty("--bg", t[0]);
    root.style.setProperty("--accent", t[1]);
  }

  // ---------- home: the poster
  function paint() {
    var w = WORKS[cur], im = w.images[idx], n = w.images.length;
    var img = $("posterImg");
    img.src = im[0]; img.width = im[1]; img.height = im[2]; img.alt = im[3];
    $("title").textContent = w.title;
    $("kicker").textContent = w.kicker;
    $("read").href = "#" + cur;
    $("num").innerHTML = "<b>" + pad(idx + 1) + "</b> / " + pad(n);
    $("what").textContent = im[4] || "";
    $("prev").hidden = $("next").hidden = n < 2;
    document.querySelectorAll("[data-work]").forEach(function (a) { a.classList.toggle("on", a.dataset.work === cur); });
    tone(cur);
  }
  function setWork(k) { if (k !== cur) { cur = k; idx = 0; paint(); } }
  function turn(step) {
    var n = WORKS[cur].images.length;
    if (n < 2 || lock) return;
    lock = true; setTimeout(function () { lock = false; }, 350);
    idx = (idx + step + n) % n; paint();
  }

  var fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (!fine) poster.classList.remove("pointer");
  document.querySelectorAll("[data-work]").forEach(function (a) {
    a.addEventListener("mouseenter", function () { if (fine) setWork(a.dataset.work); });
    a.addEventListener("focus", function () { setWork(a.dataset.work); });
  });

  var acc = 0, accT = 0;
  window.addEventListener("wheel", function (e) {
    if (!root.classList.contains("home")) return;
    e.preventDefault();
    var now = Date.now(); if (now - accT > 220) acc = 0; accT = now;
    acc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (Math.abs(acc) > 40) { turn(acc > 0 ? 1 : -1); acc = 0; }
  }, { passive: false });
  var down = null, moved = false;
  poster.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY }; moved = false; });
  poster.addEventListener("pointermove", function (e) {
    var c = $("cursor"), half = e.clientX < innerWidth / 2;
    c.style.left = e.clientX + "px"; c.style.top = e.clientY + "px";
    c.textContent = half ? "← Previous" : "Next →";
    c.classList.toggle("on", fine && WORKS[cur].images.length > 1);
    if (down && Math.abs(e.clientX - down.x) > 8) moved = true;
  });
  poster.addEventListener("pointerleave", function () { $("cursor").classList.remove("on"); });
  poster.addEventListener("pointerup", function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { turn(dx < 0 ? 1 : -1); return; }
    if (!moved) turn(e.clientX < innerWidth / 2 ? -1 : 1);
  });
  $("prev").addEventListener("click", function () { turn(-1); });
  $("next").addEventListener("click", function () { turn(1); });
  document.addEventListener("keydown", function (e) {
    if (!root.classList.contains("home")) { if (e.key === "Escape") location.hash = ""; return; }
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); turn(1); }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); turn(-1); }
  });

  // ---------- article: the long read
  function fig(im) {
    var cls = im[2] > im[1] * 1.05 ? "tall" : (Math.abs(im[1] - im[2]) < im[1] * 0.05 ? "sq" : "");
    return '<figure class="' + cls + '"><img src="' + im[0] + '" width="' + im[1] + '" height="' + im[2] + '" alt="' + esc(im[3]) + '" loading="lazy">' + (im[4] ? '<figcaption>' + esc(im[4]) + '</figcaption>' : '') + '</figure>';
  }
  function article(k) {
    var w = WORKS[k], tpl = $("t-" + k).content.cloneNode(true), box = document.createElement("div");
    box.appendChild(tpl);
    var h2 = box.querySelector("h2"); if (h2) h2.remove();
    var html = "";
    if (w && w.images.length) {
      var hero = w.images[0];
      html += '<figure class="hero' + (w.heroFull ? ' full' : '') + '"><img src="' + hero[0] + '" width="' + hero[1] + '" height="' + hero[2] + '" alt="' + esc(hero[3]) + '"><div class="veil"></div>' +
        '<div class="hero-text"><span class="label">' + esc(w.kicker) + '</span><h1>' + esc(w.title) + '</h1></div></figure>';
    } else {
      html += '<header class="plain-head"><span class="label">' + (w ? esc(w.kicker) : "") + '</span><h1>' + (w ? esc(w.title) : PAGES[k]) + '</h1></header>';
    }
    // text, with the work's images set between the paragraphs
    var custom = !!box.querySelector("figure");
    var rest = w && !custom ? w.images.slice(1) : [], out = '<div class="body">', col = "";
    var flush = function () { if (col) { out += '<div class="col">' + col + '</div>'; col = ""; } };
    Array.prototype.forEach.call(box.children, function (el, i) {
      if (el.tagName === "FIGURE" || el.classList.contains("pair") || el.classList.contains("seq") || el.classList.contains("palette") || el.classList.contains("tiles")) { flush(); out += el.outerHTML; return; }
      col += el.outerHTML;
      if (el.tagName === "P" && rest.length && i > 0) {
        flush();
        if (rest.length >= 2 && rest[0][2] > rest[0][1] * 0.9 && rest[1][2] > rest[1][1] * 0.9) out += '<div class="pair">' + fig(rest.shift()) + fig(rest.shift()) + '</div>';
        else out += fig(rest.shift());
      }
    });
    flush();
    while (rest.length) {
      if (rest.length >= 2 && rest[0][2] >= rest[0][1] * 0.9 && rest[1][2] >= rest[1][1] * 0.9) out += '<div class="pair">' + fig(rest.shift()) + fig(rest.shift()) + '</div>';
      else out += fig(rest.shift());
    }
    if (w) {
      var nk = ORDER[(ORDER.indexOf(k) + 1) % ORDER.length];
      out += '<nav class="next" aria-label="Next work"><span class="label">Next work</span><a href="#' + nk + '">' + esc(WORKS[nk].title) + '</a></nav>';
    }
    out += '</div>';
    $("article").innerHTML = html + out;
    tone(k);
  }

  function route() {
    var h = (location.hash || "").slice(1);
    var open = WORKS[h] || PAGES[h];
    root.classList.toggle("home", !open);
    root.classList.toggle("article", !!open);
    $("home").hidden = !!open;
    $("article").hidden = !open;
    document.querySelectorAll("[data-page]").forEach(function (a) { a.classList.toggle("on", a.dataset.page === h); });
    if (open) { article(h); window.scrollTo(0, 0); }
    else { if (WORKS[cur]) paint(); }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
